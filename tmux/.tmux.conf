set-window-option -g mode-keys vi
bind v copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Status bar
set -g status-style "bg=#152238,fg=#ffffff"

# Left side
set -g status-left-style "bg=#152238,fg=#ffffff"

# Right side
set -g status-right-style "bg=#152238,fg=#ffffff"

# Window list
setw -g window-status-style "bg=#152238,fg=#ffffff"
setw -g window-status-current-style "bg=#274060,fg=#ffffff,bold"

# Pane borders
set -g pane-border-style "fg=#3a4a5c"
set -g pane-active-border-style "fg=#6b8fb3"

# Messages / command prompt
set -g message-style "bg=#274060,fg=#ffffff"
